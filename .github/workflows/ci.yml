name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light install only: heavy CV packages are not needed for these checks
      - run: pip install ruff pytest
      - run: ruff check .
      - run: pytest -q

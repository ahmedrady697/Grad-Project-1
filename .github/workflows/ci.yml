name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Light install only: no cv2, torch or insightface (tests use a fake face analyzer)
      - run: pip install ruff pytest numpy fastapi httpx
      - run: ruff check .
      - run: pytest -q
